[package]
name = "webhook-runners"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = "1.11.0"
# default features include the deprecated `rustls` feature, which pulls in the
# legacy rustls 0.21 / rustls-webpki 0.101 stack (RUSTSEC via GHSA-82j2-j2ch-gfr8)
# alongside the modern one. `default-https-client` is the supported TLS path.
aws-sdk-ecs = { version = "1.141.0", default-features = false, features = [
    "default-https-client",
    "rt-tokio",
] }
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing-subscriber = "0.3.23"
hyper = "1.11.1"
tracing = "0.1.44"
hex = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.0"
constant_time_eq = "0.6.0"
openssl = { version = "0.10.81", features = ["vendored"] }
lambda_http = "1.3.1"
http = "1.5.0"
# Pinned to 10 to match octocrab's jsonwebtoken requirement (^10); a mismatched
# major would make EncodingKey a distinct type from the one Octocrab::app() takes.
jsonwebtoken = "11.0.0"
# Mirrors octocrab's default features, but swaps the JWT backend from
# `jwt-rust-crypto` to `jwt-aws-lc-rs`: the former pulls in the pure-Rust `rsa`
# crate, which has an unfixed Marvin timing sidechannel (RUSTSEC-2023-0071).
# aws-lc-rs is already in the tree via the AWS SDK's TLS stack.
octocrab = { version = "0.54.1", default-features = false, features = [
    "follow-redirect",
    "retry",
    "rustls",
    "rustls-ring",
    "timeout",
    "tracing",
    "default-client",
    "jwt-aws-lc-rs",
] }
anyhow = "1.0.104"
