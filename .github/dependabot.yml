version: 2

updates:
  - package-ecosystem: "cargo"
    # The only Rust crate lives here; "/" has no Cargo.toml, so Dependabot was
    # silently scanning nothing and security updates never opened PRs.
    directory: "/webhook-runners"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    groups:
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "terraform"
    # There is no /terraform directory; the modules are at the root and in
    # these subdirectories.
    directories:
      - "/"
      - "/cache-server"
      - "/runner"
      - "/setup-runners"
      - "/webhook-runners"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "terraform"
